[workspace]
resolver = "2"
members = [
    "crates/bubba-core",
    "crates/bubba-analyzer",
    "crates/bubba-midi",
    "crates/bubba-app",
]

[workspace.dependencies]
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
midir = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
rtrb = "0.3"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
anyhow = "1.0"
